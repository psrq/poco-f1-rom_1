name: Download ROM to Releases

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download ROM
        run: |
          set -euo pipefail
          FILE="miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          REF="https://miui.com/"

          MIRRORS=(
            "https://bigota.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
            "https://cdnorg.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
            "https://bn.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
            "https://hugeota.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
          )

          rm -f "$FILE" "$FILE.aria2"
          OK=0

          for m in "${MIRRORS[@]}"; do
            echo ""
            echo "════════════════════════════════════════════"
            echo ">>> Зеркало: $m"
            echo "════════════════════════════════════════════"

            # ── Шаг 1: разведка через curl (как у тебя раньше) ──
            HEADERS=$(curl -sIL -A "$UA" -e "$REF" --connect-timeout 20 --max-time 60 "$m" || true)
            CT=$(echo "$HEADERS" | grep -i '^content-type:' | tail -1 | awk '{print $2}' | tr -d '\r')
            CL=$(echo "$HEADERS" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r')
            FINAL=$(curl -sIL -A "$UA" -e "$REF" -o /dev/null -w '%{url_effective}' "$m" || true)

            echo "  Content-Type   : $CT"
            echo "  Content-Length : $CL"
            echo "  Final URL      : $FINAL"

            # Отсеиваем HTML-заглушки и 404
            if [[ -z "$CT" || "$CT" == *"html"* || "$CT" == *"text/"* ]]; then
              echo "  ⚠️  Не бинарь (HTML/text) — пропускаем"
              continue
            fi
            if [ -z "$CL" ] || [ "$CL" -lt 100000000 ]; then
              echo "  ⚠️  Размер < 100 MB — пропускаем"
              continue
            fi

            echo "  ✅ Зеркало валидное, ~$((CL/1024/1024)) MB"

            # ── Шаг 2: aria2c на финальном URL (curl уже прошёл редиректы) ──
            echo "  → aria2c (16 потоков)..."
            if aria2c \
                -x 16 -s 16 -k 1M \
                --file-allocation=none \
                --max-tries=5 --retry-wait=3 \
                --connect-timeout=20 --timeout=60 \
                --lowest-speed-limit=50K \
                --user-agent="$UA" \
                --referer="$REF" \
                --header="Accept: */*" \
                --summary-interval=15 \
                --console-log-level=warn \
                --allow-overwrite=true \
                -o "$FILE" \
                "$FINAL" ; then

              SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 100000000 ]; then
                echo "  ✅ aria2c скачал: $SIZE байт"
                OK=1
                break
              else
                echo "  ⚠️  aria2c отдал $SIZE байт — не ROM, откат"
                rm -f "$FILE"
              fi
            else
              echo "  ⚠️  aria2c не смог — пробуем curl fallback"
              rm -f "$FILE" "$FILE.aria2"
            fi

            # ── Шаг 3: fallback — curl с докачкой (то, что работало) ──
            echo "  → curl fallback (resume, до 3 попыток)..."
            for attempt in 1 2 3; do
              echo "    попытка $attempt..."
              if curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors \
                   -C - \
                   -A "$UA" -e "$REF" \
                   --connect-timeout 30 \
                   -o "$FILE" \
                   "$FINAL" ; then
                break
              fi
              sleep 5
            done

            SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 100000000 ]; then
              echo "  ✅ curl скачал: $SIZE байт"
              OK=1
              break
            fi
          done

          if [ "$OK" -ne 1 ]; then
            echo "❌ Ни одно зеркало не сработало"
            exit 1
          fi

          echo ""
          echo "═══ Итог ═══"
          ls -lh "$FILE"
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          echo "$SHA" > "$FILE.sha256"
          echo "SHA256: $SHA"

          # Защита от мусора
          SIZE=$(stat -c%s "$FILE")
          if [ "$SIZE" -lt 100000000 ]; then
            echo "❌ Итоговый файл слишком мал"
            exit 1
          fi

      - name: Split if > 2 GiB
        run: |
          set -euo pipefail
          FILE="miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip"
          SIZE=$(stat -c%s "$FILE")
          LIMIT=2147483648

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "Файл $SIZE байт > 2 GiB → split"
            split -b 1900M -d "$FILE" "${FILE}.part_"
            rm -f "$FILE"
            ls -1 "${FILE}".part_* > upload_files.txt
          else
            echo "Файл $SIZE байт ≤ 2 GiB → целиком"
            echo "$FILE" > upload_files.txt
          fi

          echo "$FILE.sha256" >> upload_files.txt
          echo "К загрузке:"
          cat upload_files.txt

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v12.0.3.0"
          name: "MIUI V12.0.3.0.QEJRUXM (POCO F1)"
          body: |
            ## MIUI V12.0.3.0.QEJRUXM для POCO F1 (Global)

            Файл: `miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip`

            ### Проверка целостности
            ```
            sha256sum -c miui_...zip.sha256
            ```

            ### Если прошивка загружена частями (`*.part_*`)
            **Linux / macOS:**
            ```bash
            cat miui_*.zip.part_* > miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip
            ```

            **Windows PowerShell:**
            ```powershell
            $parts = Get-ChildItem miui_*.zip.part_* | Sort-Object Name
            $out = "miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip"
            if (Test-Path $out) { Remove-Item $out }
            foreach ($p in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($p.FullName)
              $fs = [System.IO.File]::Open($out, 'Append')
              $fs.Write($bytes, 0, $bytes.Length)
              $fs.Close()
            }
            ```
          files: |
            ${{ github.workspace }}/upload_files.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

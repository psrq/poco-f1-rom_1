name: Download ROM to Releases

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download ROM
        run: |
          set -euo pipefail
          FILE="miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          REF="https://miui.com/"

          MIRRORS=(
            "https://bigota.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
            "https://cdnorg.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
            "https://bn.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
            "https://hugeota.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
          )

          echo "=== Разведка зеркал (curl) ==="
          VALID=()
          for m in "${MIRRORS[@]}"; do
            HDR=$(curl -sIL -A "$UA" -e "$REF" --connect-timeout 20 --max-time 45 "$m" 2>/dev/null || true)
            CT=$(echo "$HDR" | grep -i '^content-type:' | tail -1 | awk '{print $2}' | tr -d '\r' || true)
            CL=$(echo "$HDR" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r' || true)

            if [[ -z "$CT" || "$CT" == *"html"* || "$CT" == *"text/"* ]]; then
              echo "  ❌ HTML/text ($CT) — $m"
              continue
            fi
            if [ -z "$CL" ] || [ "$CL" -lt 100000000 ]; then
              echo "  ❌ Слишком мал ($CL) — $m"
              continue
            fi
            echo "  ✅ $((CL/1024/1024)) MB — $m"
            VALID+=("$m")
          done

          if [ "${#VALID[@]}" -eq 0 ]; then
            echo "❌ Ни одно зеркало не отдало валидный ROM"
            exit 1
          fi

          echo ""
          echo "=== Скачивание (по очереди с зеркал, 16 соединений) ==="

          OK=0
          for m in "${VALID[@]}"; do
            echo ""
            echo ">>> Пробуем: $m"

            rm -f "$FILE" "${FILE}.aria2"

            # Отключаем set -e на время aria2c: exit code 13 = часть соединений отвалилась,
            # НО файл может быть скачан полностью. Проверяем по факту, не по коду.
            set +e
            aria2c \
              -x 16 -s 16 -k 1M \
              --file-allocation=none \
              --max-tries=0 \
              --retry-wait=5 \
              --connect-timeout=30 \
              --timeout=120 \
              --continue=true \
              --allow-overwrite=true \
              --auto-file-renaming=false \
              --summary-interval=15 \
              --console-log-level=warn \
              --check-certificate=false \
              --max-connection-per-server=16 \
              --min-split-size=1M \
              -U "$UA" \
              --referer="$REF" \
              -o "$FILE" \
              "$m"
            ARIA_EXIT=$?
            set -e

            echo "aria2c exit code: $ARIA_EXIT"

            if [ ! -f "$FILE" ]; then
              echo "  ⚠️  Файл не создан — идём к следующему зеркалу"
              continue
            fi

            SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            echo "  Размер: $SIZE байт"

            if [ "$SIZE" -lt 100000000 ]; then
              echo "  ⚠️  Файл слишком мал — не ROM, пробуем следующее зеркало"
              rm -f "$FILE"
              continue
            fi

            # Сравниваем с ожидаемым Content-Length
            EXPECTED=$(curl -sIL -A "$UA" -e "$REF" "$m" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r' || true)
            if [ -n "$EXPECTED" ] && [ "$SIZE" != "$EXPECTED" ]; then
              echo "  ⚠️  Размер не совпал: получено $SIZE, ожидалось $EXPECTED — пробуем другое зеркало"
              rm -f "$FILE"
              continue
            fi

            echo "  ✅ Скачано успешно: $SIZE байт"
            OK=1
            break
          done

          if [ "$OK" -ne 1 ]; then
            echo "❌ Ни одно зеркало не смогло скачать файл целиком"
            exit 1
          fi

          echo ""
          echo "=== Итог скачивания ==="
          ls -lh "$FILE"
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          echo "$SHA" > "${FILE}.sha256"
          echo "SHA256: $SHA"

      - name: Prepare file list
        id: prep
        run: |
          set -euo pipefail
          FILE="miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip"
          SIZE=$(stat -c%s "$FILE")
          LIMIT=2147483648

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "Размер $SIZE > 2 GiB → split на части по 1900 MB"
            split -b 1900M -d "$FILE" "${FILE}.part_"
            rm -f "$FILE"
            PARTS=$(ls -1 "${FILE}".part_*)
            FILES="${PARTS}"$'\n'"${FILE}.sha256"
          else
            echo "Размер $SIZE ≤ 2 GiB → заливаем целиком"
            FILES="${FILE}"$'\n'"${FILE}.sha256"
          fi

          echo ""
          echo "=== Файлы к загрузке ==="
          echo "$FILES"
          echo "========================"

          # Многострочный output для следующего шага
          {
            echo "files<<__EOF__"
            echo "$FILES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v12.0.3.0"
          name: "MIUI V12.0.3.0.QEJRUXM (POCO F1)"
          body: |
            ## MIUI V12.0.3.0.QEJRUXM для POCO F1 (Global)

            Файл: `miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip`

            ### Проверка целостности

            **Linux / macOS:**
            ```bash
            sha256sum -c miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip.sha256
            ```

            ### Если прошивка загружена частями (`*.part_*`)

            **Linux / macOS:**
            ```bash
            cat miui_*.zip.part_* > miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip
            sha256sum -c miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip.sha256
            ```

            **Windows PowerShell:**
            ```powershell
            $parts = Get-ChildItem miui_*.zip.part_* | Sort-Object Name
            $out = "miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip"
            if (Test-Path $out) { Remove-Item $out }
            foreach ($p in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($p.FullName)
              $fs = [System.IO.File]::Open($out, 'Append')
              $fs.Write($bytes, 0, $bytes.Length)
              $fs.Close()
            }
            ```
          files: ${{ steps.prep.outputs.files }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

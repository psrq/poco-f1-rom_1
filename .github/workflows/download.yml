name: Download ROM to Releases

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download ROM
        run: |
          set -euo pipefail
          FILE="miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          REF="https://miui.com/"

          # Все зеркала одного и того же файла — aria2c будет брать их как альтернативные источники
          MIRRORS=(
            "https://bigota.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
            "https://cdnorg.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
            "https://bn.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
            "https://hugeota.d.miui.com/V12.0.3.0.QEJRUXM/${FILE}"
          )

          echo "=== Разведка зеркал (curl) ==="
          VALID=()
          for m in "${MIRRORS[@]}"; do
            HDR=$(curl -sIL -A "$UA" -e "$REF" --connect-timeout 20 --max-time 45 "$m" 2>/dev/null || true)
            CT=$(echo "$HDR" | grep -i '^content-type:' | tail -1 | awk '{print $2}' | tr -d '\r' || true)
            CL=$(echo "$HDR" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r' || true)

            if [[ -z "$CT" || "$CT" == *"html"* || "$CT" == *"text/"* ]]; then
              echo "  ❌ HTML/text ($CT) — $m"
              continue
            fi
            if [ -z "$CL" ] || [ "$CL" -lt 100000000 ]; then
              echo "  ❌ Слишком мал ($CL) — $m"
              continue
            fi
            echo "  ✅ $((CL/1024/1024)) MB — $m"
            VALID+=("$m")
          done

          if [ "${#VALID[@]}" -eq 0 ]; then
            echo "❌ Ни одно зеркало не отдало валидный ROM"
            exit 1
          fi

          echo ""
          echo "=== Скачивание aria2c (мультизеркало, 16 соединений на источник) ==="

          # Формируем input-файл для aria2c: одно имя → несколько URL
          {
            echo "${VALID[0]}"
            echo "  out=${FILE}"
            echo "  user-agent=${UA}"
            echo "  referer=${REF}"
            for ((i=1; i<${#VALID[@]}; i++)); do
              echo "  ${VALID[$i]}"
            done
          } > aria2_input.txt

          echo "--- aria2 input ---"
          cat aria2_input.txt
          echo "-------------------"

          rm -f "$FILE" "$FILE.aria2"

          aria2c \
            -i aria2_input.txt \
            -x 16 \
            -s 16 \
            -j 4 \
            -k 1M \
            --file-allocation=none \
            --max-tries=0 \
            --retry-wait=5 \
            --connect-timeout=30 \
            --timeout=120 \
            --continue=true \
            --allow-overwrite=true \
            --auto-file-renaming=false \
            --summary-interval=15 \
            --console-log-level=warn \
            --check-certificate=false \
            --max-connection-per-server=16 \
            --min-split-size=1M

          echo ""
          echo "=== Проверка файла ==="
          ls -lh "$FILE"

          if [ ! -f "$FILE" ]; then
            echo "❌ Файл не создан"
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")
          echo "Размер: $SIZE байт"

          if [ "$SIZE" -lt 100000000 ]; then
            echo "❌ Файл подозрительно мал — это не ROM"
            head -c 300 "$FILE" || true
            exit 1
          fi

          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          echo "$SHA" > "${FILE}.sha256"
          echo "SHA256: $SHA"

      - name: Split if > 2 GiB
        run: |
          set -euo pipefail
          FILE="miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip"
          SIZE=$(stat -c%s "$FILE")
          LIMIT=2147483648

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "Размер $SIZE > 2 GiB → split"
            split -b 1900M -d "$FILE" "${FILE}.part_"
            rm -f "$FILE"
            ls -1 "${FILE}".part_* > upload_files.txt
          else
            echo "Размер $SIZE ≤ 2 GiB → целиком"
            echo "$FILE" > upload_files.txt
          fi

          echo "${FILE}.sha256" >> upload_files.txt
          echo ""
          echo "=== К загрузке ==="
          cat upload_files.txt

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v12.0.3.0"
          name: "MIUI V12.0.3.0.QEJRUXM (POCO F1)"
          body: |
            ## MIUI V12.0.3.0.QEJRUXM для POCO F1 (Global)

            Файл: `miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip`

            ### Проверка целостности

            **Linux / macOS:**
            ```bash
            sha256sum -c miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip.sha256
            ```

            ### Если прошивка загружена частями (`*.part_*`)

            **Linux / macOS:**
            ```bash
            cat miui_*.zip.part_* > miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip
            sha256sum -c miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip.sha256
            ```

            **Windows PowerShell:**
            ```powershell
            $parts = Get-ChildItem miui_*.zip.part_* | Sort-Object Name
            $out = "miui_POCOF1RUGlobal_V12.0.3.0.QEJRUXM_ac5b1649fc_10.0.zip"
            if (Test-Path $out) { Remove-Item $out }
            foreach ($p in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($p.FullName)
              $fs = [System.IO.File]::Open($out, 'Append')
              $fs.Write($bytes, 0, $bytes.Length)
              $fs.Close()
            }
            ```
          files: |
            ${{ github.workspace }}/upload_files.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
